<html>
<head>
    <title>Zoom Gesture</title>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width">
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/hammer.min.js"></script>
    <script src="js/ZoomGesture.js"></script>
</head>
<body>
    <img id="zoom-element" width="100%" height="100%" src="img/fantasy-wallpaper.jpg">
</body>
<script>
    var element = jQuery("#zoom-element")[0];
    var zoomGesture = new ZoomGesture(element);
    zoomGesture.scaleFactor(1);
    zoomGesture.add(["pan","pinch", "doubleTap"]);
</script>
</html>
